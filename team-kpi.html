<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoGreen CRM — أداء الفريق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --dark:#122A1C; --primary:#1B4332; --accent:#52B788; --accent-light:#95D5B2;
    --bg:#F7F5F0; --text:#1F2521; --muted:#6B7268; --danger:#C1666B; --line:#E4E2DA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--primary);color:#fff;}
  .topbar a{color:#EAF3ED;text-decoration:none;font-size:14px;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-family:'Fraunces',serif;font-size:23px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;}
  .denied{text-align:center;padding:80px 20px;color:var(--muted);}

  .emp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
  .emp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--accent-light);}
  .emp-name{font-weight:700;font-size:15px;}
  .emp-dept{color:var(--muted);font-size:12px;}
  .rate{margin-inline-start:auto;text-align:center;}
  .rate .num{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--primary);}
  .rate .lbl{font-size:10.5px;color:var(--muted);}

  .bar-track{height:8px;background:#EFEDE6;border-radius:20px;overflow:hidden;margin-bottom:14px;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:20px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}
  .stat{background:#F7F5F0;border-radius:9px;padding:9px 4px;}
  .stat .n{font-weight:700;font-size:15px;}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .stat.overdue .n{color:var(--danger);}
  .no-tasks{color:var(--muted);font-size:12.5px;text-align:center;padding:6px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html">&#8594; الرئيسية</a>
  <span class="brand" style="margin-inline-start:auto;"><img src="logo.jpg" alt="GoGreen" style="width:26px;height:26px;border-radius:50%;object-fit:cover;">GoGreen CRM</span>
</div>

<div class="wrap" id="wrap">
  <h1>أداء الفريق</h1>
  <p class="sub">نظرة عامة على مهام كل موظف ونسبة إنجازه</p>
  <div id="content"></div>
</div>

<script src="config.js"></script>
<script>
async function init(){
  const session = await requireAuth();
  if(!session) return;

  const { data: myProfile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if(myProfile?.role !== 'admin'){
    document.getElementById('content').innerHTML = '<div class="denied">الصفحة دي متاحة للأدمن بس.</div>';
    return;
  }

  const { data: people } = await sb.from('profiles').select('*, departments(name)').order('full_name');
  const { data: tasks } = await sb.from('tasks').select('*');

  const today = new Date().toISOString().split('T')[0];
  const content = document.getElementById('content');
  content.innerHTML = '';

  (people || []).forEach(p => {
    const myTasks = (tasks || []).filter(t => t.user_id === p.id);
    const total = myTasks.length;
    const completed = myTasks.filter(t => t.status === 'completed').length;
    const pending = myTasks.filter(t => t.status === 'pending').length;
    const inProgress = myTasks.filter(t => t.status === 'in_progress').length;
    const overdue = myTasks.filter(t => t.status !== 'completed' && t.due_date && t.due_date < today).length;
    const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

    const card = document.createElement('div');
    card.className = 'emp-card';
    card.innerHTML = `
      <div class="emp-head">
        <img class="avatar" src="${p.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(p.username)}&backgroundColor=52B788`}">
        <div>
          <div class="emp-name">${escapeHtml(p.full_name || p.username)}</div>
          <div class="emp-dept">${escapeHtml(p.departments?.name || '—')}</div>
        </div>
        <div class="rate">
          <div class="num">${rate}%</div>
          <div class="lbl">نسبة الإنجاز</div>
        </div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${rate}%;"></div></div>
      ${total === 0 ? '<div class="no-tasks">لسه مفيش مهام مسجّلة</div>' : `
      <div class="stat-row">
        <div class="stat"><div class="n">${total}</div><div class="l">إجمالي المهام</div></div>
        <div class="stat"><div class="n">${pending}</div><div class="l">معلقة</div></div>
        <div class="stat"><div class="n">${inProgress}</div><div class="l">قيد التنفيذ</div></div>
        <div class="stat overdue"><div class="n">${overdue}</div><div class="l">متأخرة</div></div>
      </div>`}
    `;
    content.appendChild(card);
  });

  if((people || []).length === 0){
    content.innerHTML = '<div class="denied">لسه مفيش موظفين مسجّلين.</div>';
  }
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

init();
</script>
</body>
</html>
