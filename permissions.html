<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoGreen CRM — إدارة الصلاحيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --dark:#122A1C; --primary:#1B4332; --accent:#52B788; --accent-light:#95D5B2;
    --earth:#A9814A; --bg:#F7F5F0; --text:#1F2521; --muted:#6B7268; --line:#E4E2DA;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--primary);color:#fff;}
  .topbar a{color:#EAF3ED;text-decoration:none;font-size:14px;}
  .brand{font-family:'Fraunces',serif;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-family:'Fraunces',serif;font-size:23px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 26px;}
  .denied{text-align:center;padding:80px 20px;color:var(--muted);}

  .emp-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .emp-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--accent-light);}
  .emp-name{font-weight:700;font-size:14.5px;}
  .emp-badge{font-size:10.5px;background:#EEF6F1;color:var(--primary);padding:2px 8px;border-radius:20px;margin-inline-start:8px;}
  .perm-list{display:flex;flex-wrap:wrap;gap:8px;}
  .perm-chip{
    display:flex;align-items:center;gap:6px;background:#F7F5F0;border:1.5px solid var(--line);
    border-radius:20px;padding:7px 13px;font-size:12.5px;cursor:pointer;user-select:none;transition:.15s;
  }
  .perm-chip.active{background:#EEF6F1;border-color:var(--accent);color:var(--primary);font-weight:700;}
  .perm-chip input{display:none;}
  .no-depts{color:var(--muted);font-size:12.5px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html">&#8594; الرئيسية</a>
  <span class="brand" style="margin-inline-start:auto;"><img src="logo.jpg" alt="GoGreen" style="width:26px;height:26px;border-radius:50%;object-fit:cover;">GoGreen CRM</span>
</div>

<div class="wrap" id="wrap">
  <h1>إدارة الصلاحيات</h1>
  <p class="sub">حدّد لكل موظف الأقسام المسموح له يوصلها. الأدمن دايمًا يشوف كل حاجة.</p>
  <div id="content"></div>
</div>

<script src="config.js"></script>
<script>
let departments = [];
let permissions = new Set(); // "userId:deptId"

async function init(){
  const session = await requireAuth();
  if(!session) return;

  const { data: myProfile } = await sb.from('profiles').select('role').eq('id', session.user.id).single();
  if(myProfile?.role !== 'admin'){
    document.getElementById('content').innerHTML = '<div class="denied">الصفحة دي متاحة للأدمن بس.</div>';
    return;
  }

  const [{ data: depts }, { data: people }, { data: perms }] = await Promise.all([
    sb.from('departments').select('*').order('created_at'),
    sb.from('profiles').select('*').eq('role', 'employee').order('full_name'),
    sb.from('employee_permissions').select('*'),
  ]);

  departments = depts || [];
  (perms || []).forEach(p => permissions.add(p.user_id + ':' + p.department_id));

  const content = document.getElementById('content');
  content.innerHTML = '';

  if(departments.length === 0){
    content.innerHTML = '<div class="denied">لسه مفيش أقسام متعملة. ضيف قسم الأول من الرئيسية.</div>';
    return;
  }
  if((people || []).length === 0){
    content.innerHTML = '<div class="denied">لسه مفيش موظفين مسجّلين.</div>';
    return;
  }

  people.forEach(p => {
    const card = document.createElement('div');
    card.className = 'emp-card';
    card.innerHTML = `
      <div class="emp-head">
        <img class="avatar" src="${p.avatar_url || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(p.username)}&backgroundColor=52B788`}">
        <div class="emp-name">${escapeHtml(p.full_name || p.username)}</div>
      </div>
      <div class="perm-list">
        ${departments.map(d => {
          const key = p.id + ':' + d.id;
          const active = permissions.has(key);
          return `<label class="perm-chip ${active ? 'active' : ''}" data-user="${p.id}" data-dept="${d.id}">
            <input type="checkbox" ${active ? 'checked' : ''}>
            ${d.icon || '📁'} ${escapeHtml(d.name)}
          </label>`;
        }).join('')}
      </div>
    `;
    content.appendChild(card);
  });

  document.querySelectorAll('.perm-chip').forEach(chip => {
    chip.addEventListener('click', async (e) => {
      e.preventDefault();
      const userId = chip.dataset.user;
      const deptId = chip.dataset.dept;
      const key = userId + ':' + deptId;
      const nowActive = !chip.classList.contains('active');

      chip.classList.toggle('active');

      if(nowActive){
        const { error } = await sb.from('employee_permissions').insert({ user_id: userId, department_id: deptId });
        if(error){ alert('خطأ: ' + error.message); chip.classList.toggle('active'); return; }
        permissions.add(key);
      } else {
        const { error } = await sb.from('employee_permissions').delete().eq('user_id', userId).eq('department_id', deptId);
        if(error){ alert('خطأ: ' + error.message); chip.classList.toggle('active'); return; }
        permissions.delete(key);
      }
    });
  });
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

init();
</script>
</body>
</html>
